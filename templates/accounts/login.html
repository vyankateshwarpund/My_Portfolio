{% extends 'base.html' %}
{% load static %}

{% block title %}Login | Vyankateshwar Pund Portfolio{% endblock %}

{% block content %}
<section class="py-5 mt-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="glass-card p-4">
                    <h3 class="fw-bold text-white text-center mb-4">Account Login</h3>
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-semibold">Username</label>
                            <input type="text" name="username" class="form-control glass-card border-secondary text-white" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-muted small fw-semibold">Password</label>
                            <input type="password" name="password" class="form-control glass-card border-secondary text-white" required>
                        </div>
                        <button type="submit" class="btn btn-gradient w-100 mb-3">Login</button>
                        <p class="text-muted small text-center mb-0">Don't have an account? <a href="{% url 'register' %}" class="text-primary">Register here</a></p>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
