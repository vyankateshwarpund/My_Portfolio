{% extends 'base.html' %}
{% load static %}

{% block title %}Register | Vyankateshwar Pund Portfolio{% endblock %}

{% block content %}
<section class="py-5 mt-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="glass-card p-4">
                    <h3 class="fw-bold text-white text-center mb-4">Create Account</h3>
                    <form method="POST">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-gradient w-100 mb-3 mt-3">Register</button>
                        <p class="text-muted small text-center mb-0">Already registered? <a href="{% url 'login' %}" class="text-primary">Login here</a></p>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
