{% extends 'base.html' %}
{% load static %}

{% block title %}My Profile | Vyankateshwar Pund Portfolio{% endblock %}

{% block content %}
<section class="py-5 mt-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="glass-card text-center p-5">
                    <i class="bi bi-person-circle fs-1 text-primary mb-3"></i>
                    <h3 class="fw-bold text-white mb-1">{{ user.username }}</h3>
                    <p class="text-muted small mb-3">{{ user.email|default:"Registered Visitor" }}</p>
                    <span class="badge bg-primary bg-opacity-25 text-primary mb-4">{{ profile.role_title }}</span>
                    <div>
                        <a href="{% url 'logout' %}" class="btn btn-outline-danger px-4">Logout</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
